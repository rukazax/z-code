<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="routine-miner: из повторяющихся запросов в скиллы и автоматическую подстановку">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#79c0ff"/>
    </marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0883e"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#0d1117"/>

  <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" fill="#79c0ff">routine-miner: из запросов — скиллы</text>
  <text x="24" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">Кластеризация истории → SKILL.md → подстановка блока &lt;routine&gt; без повторного разбора</text>

  <text x="24" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#7ee787">Задачи пользователя</text>
  <rect x="24" y="120" width="245" height="36" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="143" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9d1d9">подключим аккаунт GitHub</text>
  <rect x="24" y="164" width="245" height="36" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="187" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9d1d9">покажи, где лежат настройки</text>
  <rect x="24" y="208" width="245" height="36" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="231" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9d1d9">как ставили русификатор?</text>

  <path d="M269 182 L295 182" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="299" y="140" width="165" height="90" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.4"/>
  <text x="381" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#79c0ff">Кластеризатор</text>
  <text x="381" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d1d9">e5-small · cos ≥ 0.87</text>
  <text x="381" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8b949e">кластер ≥ 2 запросов</text>

  <path d="M464 185 L490 185" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="494" y="140" width="150" height="90" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.4"/>
  <text x="569" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#7ee787">SKILL.md ×N</text>
  <text x="569" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d1d9">суть · шаги · триггеры</text>
  <text x="569" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8b949e">routines/&lt;id&gt;/</text>

  <path d="M644 185 L670 185" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="674" y="140" width="202" height="90" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.4"/>
  <text x="775" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#7ee787">routines.json</text>
  <text x="775" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d1d9">id · uses · status</text>
  <text x="775" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8b949e">общий для проектов</text>

  <path d="M775 230 L775 268 L309 268 L309 296" fill="none" stroke="#f0883e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="540" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#f0883e">покрытие слов ≥ 0.38</text>

  <rect x="24" y="300" width="150" height="64" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="99" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#c9d1d9">Новый запрос</text>
  <text x="99" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">обычный промпт</text>

  <path d="M174 332 L200 332" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="204" y="300" width="210" height="64" rx="9" fill="#12261c" stroke="#7ee787" stroke-width="1.4"/>
  <text x="309" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#7ee787">UserPromptSubmit</text>
  <text x="309" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#c9d1d9">хук ищет рутину</text>

  <path d="M414 332 L440 332" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#o)"/>

  <rect x="444" y="300" width="205" height="64" rx="9" fill="#161b22" stroke="#f0883e" stroke-width="1.4"/>
  <text x="546" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#f0883e">&lt;routine&gt; блок</text>
  <text x="546" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#c9d1d9">имя · статус · суть · путь</text>

  <path d="M649 332 L675 332" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="679" y="300" width="197" height="64" rx="9" fill="#161b22" stroke="#79c0ff" stroke-width="1.4"/>
  <text x="777" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#79c0ff">Агент</text>
  <text x="777" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#c9d1d9">читает один SKILL.md</text>

  <text x="24" y="402" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e">Блок: ~40-60 токенов навигации, ~130 с абсолютным путём. Нет совпадения — 0 токенов.</text>
  <text x="24" y="424" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e">Эмбеддинги и матчинг локальные: поиск не тратит токенов. Статус auto — скилл собран автоматически.</text>
  <text x="24" y="446" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f0883e">Мало истории — мало рутин: кластеру нужно минимум два похожих запроса.</text>
</svg>
